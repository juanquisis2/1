<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGLT2 RPG Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #1a202c;
        }

        .gameboy-wrapper {
            background-color: #cbd5e0;
            padding: 20px;
            border-radius: 10px 10px 40px 10px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(255,255,255,0.5);
            max-width: 600px;
            width: 100%;
        }

        .screen-border {
            background-color: #4a5568;
            padding: 15px;
            border-radius: 10px 10px 30px 10px;
        }

        .screen {
            background-color: #f8f9fa;
            border: 4px solid #1a202c;
            border-radius: 5px;
            height: 400px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px;
        }

        .hud {
            border: 4px solid #1a202c;
            border-radius: 5px;
            background-color: white;
            padding: 10px;
            width: 220px;
            position: absolute;
            z-index: 10;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        }

        .enemy-hud { top: 20px; left: 20px; }
        .player-hud { bottom: 140px; right: 20px; }

        .hp-bar-bg {
            background-color: #1a202c;
            height: 12px;
            width: 100%;
            border-radius: 6px;
            margin-top: 5px;
            padding: 2px;
        }

        .hp-bar-fill {
            height: 100%;
            background-color: #48bb78; /* Green */
            border-radius: 4px;
            transition: width 0.5s ease, background-color 0.5s ease;
        }

        .hp-high { background-color: #48bb78; }
        .hp-med { background-color: #ecc94b; }
        .hp-low { background-color: #f56565; }

        .battle-area {
            flex-grow: 1;
            position: relative;
        }

        .sprite {
            position: absolute;
            font-size: 60px;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .enemy-sprite {
            top: 40px;
            right: 50px;
            animation: float 2s infinite ease-in-out;
        }

        .player-sprite {
            bottom: 150px;
            left: 50px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .damage-text {
            position: absolute;
            color: #e53e3e;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 white;
            animation: floatUp 1s forwards;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        .dialog-box {
            height: 120px;
            border-top: 4px solid #1a202c;
            background-color: white;
            display: flex;
            position: relative;
        }

        .message-area {
            padding: 15px;
            font-size: 12px;
            line-height: 1.8;
            flex-grow: 1;
            width: 100%;
        }

        .menu-area {
            border-left: 4px solid #1a202c;
            width: 40%;
            display: none;
            flex-wrap: wrap;
            padding: 5px;
        }

        .menu-btn {
            width: 100%;
            background: none;
            border: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            text-align: left;
            padding: 10px;
            cursor: pointer;
            position: relative;
        }

        .menu-btn:hover { background-color: #edf2f7; }
        
        .menu-btn:hover::before {
            content: '▶';
            position: absolute;
            left: -2px;
            top: 10px;
        }

        .blink-arrow {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 14px;
            animation: blink 1s infinite;
            cursor: pointer;
            display: none;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="gameboy-wrapper">
        <div class="screen-border">
            <div class="screen" id="game-screen">
                
                <!-- HUDs -->
                <div class="hud enemy-hud">
                    <div class="text-[10px] mb-1">SGLT2 (Túbulo)</div>
                    <div class="text-[8px] text-gray-500">Lv 99 Glucosa en Sangre</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill hp-low" id="enemy-hp-bar" style="width: 100%;"></div></div>
                </div>

                <div class="hud player-hud">
                    <div class="text-[10px] mb-1">-FLOZINA</div>
                    <div class="text-[8px] text-gray-500">HP CV/Renal</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill hp-high" id="player-hp-bar" style="width: 100%;"></div></div>
                </div>

                <!-- Battle Area -->
                <div class="battle-area">
                    <div class="sprite enemy-sprite" id="enemy-sprite">🧱🍬</div>
                    <div class="sprite player-sprite" id="player-sprite">💊✨</div>
                </div>

                <!-- Dialog and Menus -->
                <div class="dialog-box">
                    <div class="message-area" id="message-text"></div>
                    <div class="blink-arrow" id="next-arrow">▼</div>
                    
                    <div class="menu-area" id="action-menu">
                        <button class="menu-btn text-blue-600" onclick="playerAttack('bloqueo')">1. Bloquear SGLT2</button>
                        <button class="menu-btn text-yellow-600" onclick="playerAttack('glucosuria')">2. Glucosuria</button>
                        <button class="menu-btn text-cyan-500" onclick="playerAttack('diuresis')">3. Diuresis</button>
                        <button class="menu-btn text-green-600" onclick="playerAttack('cardio')">4. Escudo Cardio</button>
                    </div>
                </div>

            </div>
        </div>
        <div class="mt-4 text-center text-[10px] text-gray-500">Operación Glucosuria RPG</div>
    </div>

    <script>
        // Game State
        let enemyHP = 100; // Represents Blood Glucose (Starts dangerously high, so we want it down)
        let playerHP = 100; // Represents Cardiovascular Health
        let isEnemyTurn = false;
        let blocked = false;
        
        // DOM Elements
        const msgText = document.getElementById('message-text');
        const nextArrow = document.getElementById('next-arrow');
        const actionMenu = document.getElementById('action-menu');
        const enemyBar = document.getElementById('enemy-hp-bar');
        const playerBar = document.getElementById('player-hp-bar');
        const enemySprite = document.getElementById('enemy-sprite');
        const playerSprite = document.getElementById('player-sprite');
        const battleArea = document.querySelector('.battle-area');

        // Typewriter effect
        let isTyping = false;
        let dialogQueue = [];

        function typeMessage(text, callback) {
            isTyping = true;
            msgText.innerHTML = '';
            actionMenu.style.display = 'none';
            nextArrow.style.display = 'none';
            
            let i = 0;
            let speed = 30; // ms per char

            function typeWriter() {
                if (i < text.length) {
                    msgText.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                } else {
                    isTyping = false;
                    if (callback) {
                        nextArrow.style.display = 'block';
                        nextArrow.onclick = () => {
                            nextArrow.style.display = 'none';
                            nextArrow.onclick = null;
                            callback();
                        };
                    } else {
                        showMenu();
                    }
                }
            }
            typeWriter();
        }

        function updateHPBars() {
            enemyBar.style.width = enemyHP + '%';
            if (enemyHP > 50) enemyBar.className = 'hp-bar-fill hp-low'; // High sugar is bad (Red)
            else if (enemyHP > 20) enemyBar.className = 'hp-bar-fill hp-med'; // Med sugar (Yellow)
            else enemyBar.className = 'hp-bar-fill hp-high'; // Normal sugar (Green)

            playerBar.style.width = playerHP + '%';
        }

        function showDamage(target, amount, text = '') {
            const damageEl = document.createElement('div');
            damageEl.className = 'damage-text';
            damageEl.innerText = text ? text : `-${amount}`;
            
            if (target === 'enemy') {
                damageEl.style.top = '40px';
                damageEl.style.right = '80px';
                enemySprite.style.animation = 'shake 0.5s';
                setTimeout(() => enemySprite.style.animation = 'float 2s infinite ease-in-out', 500);
            } else {
                damageEl.style.bottom = '180px';
                damageEl.style.left = '80px';
                playerSprite.style.animation = 'shake 0.5s';
                setTimeout(() => playerSprite.style.animation = 'none', 500);
            }
            
            battleArea.appendChild(damageEl);
            setTimeout(() => damageEl.remove(), 1000);
        }

        function showMenu() {
            msgText.innerHTML = '¿Qué debería hacer<br>DAPAGLIFLOZINA?';
            actionMenu.style.display = 'flex';
        }

        function playerAttack(move) {
            actionMenu.style.display = 'none';
            
            if (move === 'bloqueo') {
                typeMessage("¡Dapagliflozina usó BLOQUEO DE RECEPTOR!", () => {
                    blocked = true;
                    showDamage('enemy', 0, '¡SGLT2 Bloqueado!');
                    typeMessage("El SGLT2 ya no puede reabsorber azúcar de la orina.", enemyTurn);
                });
            } 
            else if (move === 'glucosuria') {
                if (!blocked) {
                    typeMessage("¡SGLT2 bloqueó el ataque! Primero debes inhibirlo.", enemyTurn);
                    return;
                }
                typeMessage("¡Dapagliflozina forzó la GLUCOSURIA!", () => {
                    let dmg = 35;
                    enemyHP = Math.max(0, enemyHP - dmg);
                    updateHPBars();
                    showDamage('enemy', dmg);
                    typeMessage("¡Ataque Súper Efectivo! Toneladas de glucosa se fueron por la orina.", checkWin);
                });
            }
            else if (move === 'diuresis') {
                if (!blocked) {
                    typeMessage("No hay azúcar en la orina para arrastrar agua aún.", enemyTurn);
                    return;
                }
                typeMessage("¡Natriuresis y DIURESIS OSMÓTICA!", () => {
                    let dmg = 20;
                    enemyHP = Math.max(0, enemyHP - dmg);
                    updateHPBars();
                    showDamage('enemy', dmg);
                    typeMessage("El sodio y el agua escapan. La presión arterial disminuye.", checkWin);
                });
            }
            else if (move === 'cardio') {
                typeMessage("¡Dapagliflozina activó PROTECCIÓN CARDIO-RENAL!", () => {
                    playerHP = Math.min(100, playerHP + 30);
                    updateHPBars();
                    showDamage('player', 0, '+Protección');
                    typeMessage("El corazón y los riñones están blindados contra el desgaste.", enemyTurn);
                });
            }
        }

        function enemyTurn() {
            isEnemyTurn = true;
            typeMessage("Turno del SGLT2 del Túbulo Proximal...", () => {
                
                if (blocked) {
                    typeMessage("SGLT2 intenta reabsorber glucosa... ¡Pero está BLOQUEADO por la -Flozina!", () => {
                        isEnemyTurn = false;
                        showMenu();
                    });
                } else {
                    typeMessage("SGLT2 usa REABSORCIÓN MASIVA.", () => {
                        enemyHP = Math.min(100, enemyHP + 20);
                        playerHP = Math.max(0, playerHP - 15);
                        updateHPBars();
                        showDamage('player', 15);
                        showDamage('enemy', 0, '+Glucosa');
                        typeMessage("La Glucosa en Sangre sube. Los órganos sufren daño por toxicidad.", () => {
                            if (playerHP <= 0) gameOver();
                            else {
                                isEnemyTurn = false;
                                showMenu();
                            }
                        });
                    });
                }
            });
        }

        function checkWin() {
            if (enemyHP <= 0) {
                typeMessage("¡La Glucosa en Sangre se ha normalizado!", () => {
                    enemySprite.style.display = 'none';
                    typeMessage("SGLT2 ha sido derrotado pacíficamente. ¡El paciente está a salvo gracias a la Glucosuria!", () => {
                        msgText.innerHTML = "<span class='text-green-600'>¡VICTORIA FARMACOLÓGICA!</span><br>Has aprendido el mecanismo de acción.";
                    });
                });
            } else {
                enemyTurn();
            }
        }

        function gameOver() {
            playerSprite.style.display = 'none';
            typeMessage("Los órganos fallaron por la alta presión y glucosa... Fin de la partida.", () => {
                msgText.innerHTML = "<span class='text-red-600'>GAME OVER</span><br>Recarga para intentarlo de nuevo.";
            });
        }

        // Initialize Game
        setTimeout(() => {
            typeMessage("¡Un SGLT2 salvaje ha aparecido! Está devolviendo toda la glucosa a la sangre.", () => {
                showMenu();
            });
        }, 1000);

    </script>
</body>
</html>
